name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Audit runtime dependencies
        run: |
          set +e
          npm audit --audit-level=high --omit=dev | tee npm-audit.txt
          RESULT=${PIPESTATUS[0]}
          {
            echo "## npm audit (production tree, fail on high+)"
            echo
            echo '```'
            cat npm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --json --omit=dev > npm-audit.json || true
          exit $RESULT

      - name: Verify package signatures (Sigstore)
        run: |
          set +e
          npm ci --ignore-scripts > /dev/null
          npm audit signatures | tee npm-signatures.txt
          RESULT=${PIPESTATUS[0]}
          {
            echo "## npm audit signatures (Sigstore verification)"
            echo
            echo '```'
            cat npm-signatures.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RESULT

      - name: Upload npm-audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit
          path: |
            npm-audit.txt
            npm-audit.json
            npm-signatures.txt
          retention-days: 90

  lockfile-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate lockfile registry pins (anti-poisoning)
        run: |
          set +e
          npx --yes lockfile-lint@4 \
            --path package-lock.json \
            --type npm \
            --validate-https \
            --validate-integrity \
            --validate-package-names \
            --allowed-hosts npm npm.pkg.github.com 2>&1 | tee lockfile-lint.txt
          RESULT=${PIPESTATUS[0]}
          {
            echo "## lockfile-lint (anti-poisoning + dependency-confusion)"
            echo
            echo '```'
            cat lockfile-lint.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RESULT

      - name: Upload lockfile-lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lockfile-lint
          path: lockfile-lint.txt
          retention-days: 90

  sast:
    # Semgrep SAST. Replaces CodeQL on this private repo (no GHAS required).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: python3 -m pip install --user semgrep==1.140.0

      - name: Run Semgrep
        run: |
          set +e
          # Human-readable text report for the step summary
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/security-audit \
            --error \
            --strict \
            --metrics=off 2>&1 | tee semgrep.txt
          RESULT=${PIPESTATUS[0]}
          # SARIF artifact (importable into other tools / Code Scanning later)
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/security-audit \
            --sarif \
            --output=semgrep.sarif \
            --metrics=off > /dev/null 2>&1 || true
          {
            echo "## Semgrep SAST"
            echo
            echo '```'
            cat semgrep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RESULT

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep
          path: |
            semgrep.txt
            semgrep.sarif
          retention-days: 90

  vuln-scan:
    # OSV-Scanner. Queries OSV.dev (broader vulnerability source than npm
    # advisories), catching deps before they show up in `npm audit`.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run OSV-Scanner (markdown report)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --format=markdown
            --output=osv-report.md
            --lockfile=./package-lock.json

      - name: Run OSV-Scanner (JSON artifact)
        if: always()
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --format=json
            --output=osv-report.json
            --lockfile=./package-lock.json

      - name: Append report to step summary
        if: always()
        run: |
          {
            echo "## OSV-Scanner (production deps)"
            echo
            if [ -s osv-report.md ]; then
              cat osv-report.md
            else
              echo "_No vulnerabilities found._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OSV-Scanner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner
          path: |
            osv-report.md
            osv-report.json
          retention-days: 90
