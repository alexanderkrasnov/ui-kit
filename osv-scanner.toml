# OSV-Scanner config. https://google.github.io/osv-scanner/configuration/
#
# Skip dev-only dependencies in the npm tree. Rationale: dev deps are not
# included in the published @alexanderkrasnov/plexo-ui-kit artifact, so a vulnerability
# in (e.g.) postcss or storybook does not affect consumers. Production deps
# are still gated — by `npm audit --audit-level=high --omit=dev`,
# `npm audit signatures`, and OSV-Scanner itself for non-dev packages.
#
# This mirrors the posture of `npm audit --omit=dev`.
[[PackageOverrides]]
ecosystem = "npm"
group = "dev"
ignore = true
reason = "Dev dependencies are not bundled in the published artifact. Prod-tree vulns are still gated."
