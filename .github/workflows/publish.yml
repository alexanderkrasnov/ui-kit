name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write       # needed to upload SBOM as a release asset
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@alexanderkrasnov'

      - run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Verify dependency signatures (Sigstore)
        run: npm audit signatures

      - name: Validate lockfile registry pins
        run: |
          npx --yes lockfile-lint@4 \
            --path package-lock.json \
            --type npm \
            --validate-https \
            --validate-integrity \
            --allowed-hosts npm \
            --allowed-hosts npm.pkg.github.com \
            --allowed-schemes "https:"

      - run: npm run build

      - name: Generate CycloneDX SBOM
        # NTIA-minimum SBOM for the published artifact. Released alongside
        # the package so downstream consumers (and auditors) can verify the
        # exact dependency tree that shipped.
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --omit dev \
            --output-format JSON \
            --output-file sbom.cdx.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cdx.json
          retention-days: 365

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            sbom.cdx.json || \
          gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --clobber
