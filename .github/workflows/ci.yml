name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Audit runtime dependencies (fails on high/critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Verify package signatures (Sigstore)
        # Defends against tampered tarballs and compromised-maintainer releases
        # by validating registry-issued Sigstore attestations on every dep.
        run: |
          npm ci --ignore-scripts
          npm audit signatures

  lockfile-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate lockfile registry pins (anti-poisoning)
        # Refuses any `resolved` URL that points outside the allow-list, lacks
        # https, or is missing an integrity hash. Mitigates lockfile-poisoning
        # PRs and dependency-confusion via a tampered package-lock.json.
        run: |
          npx --yes lockfile-lint@4 \
            --path package-lock.json \
            --type npm \
            --validate-https \
            --validate-integrity \
            --validate-package-names \
            --allowed-hosts npm \
            --allowed-hosts npm.pkg.github.com \
            --allowed-schemes "https:"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
